<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#c94b49" />
    <title>Borrius · Live companion</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/dex.css" />
    <link rel="stylesheet" href="/type-tools.css" />
    <link rel="stylesheet" href="/battle-prep.css" />
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <div class="shell">
      <aside>
        <a class="brand" href="#today"
          ><span class="mark"></span
          ><span>BORRIUS<small>A TRAINER’S FIELD GUIDE</small></span></a
        >
        <nav aria-label="Main">
          <a href="#today">● <span>Camp</span></a
          ><a href="#lab">▣ <span>Pokémon</span></a
          ><a href="#prepare">⚑ <span>Battle prep</span></a
          ><a href="#dex">▤ <span>Pokédex</span></a
          ><a href="#types">◈ <span>Type Desk</span></a
          ><a href="#journey">✎ <span>Journal</span></a
          ><a href="#settings">↔ <span>Link</span></a>
        </nav>
        <div class="aside-foot">
          <span class="light"></span> READ-ONLY COMPANION
          <p>Your game stays yours.<br />We analyze saved snapshots.</p>
        </div>
      </aside>
      <main>
        <header>
          <span id="status">Connecting to your playthrough…</span
          ><button id="refresh" class="quiet">↻ Refresh</button>
        </header>
        <div id="notice" role="status" aria-live="polite"></div>
        <div id="content">
          <div class="empty">Loading your playthrough…</div>
        </div>
        <footer>
          BORRIUS FIELD GUIDE
          <span>Made for the journey, one save at a time.</span>
        </footer>
      </main>
    </div>
    <dialog id="detail">
      <button class="close" aria-label="Close Pokémon details">×</button>
      <div id="detail-content"></div>
    </dialog>
  </body>
</html>
